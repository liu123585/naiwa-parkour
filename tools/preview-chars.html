<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>角色建模调试台</title>
<style>
  body{margin:0;background:#eef2f7;font-family:"Microsoft YaHei",sans-serif;color:#20232a}
  h1{font-size:18px;margin:10px 16px}
  .grid{display:flex;flex-wrap:wrap;gap:10px;padding:0 16px 24px}
  .cell{background:#fff;border-radius:14px;padding:8px;box-shadow:0 4px 12px rgba(0,0,0,.08);text-align:center}
  .cell canvas{display:block;background:
     linear-gradient(0deg,rgba(0,0,0,.05) 0 1px,transparent 1px 100%),
     repeating-linear-gradient(0deg,#fafcff 0 26px,#f2f6fb 26px 52px)}
  .name{font-size:12px;font-weight:800;margin-top:6px}
  .legend{font-size:12px;color:#667;margin:0 16px 10px}
</style>
</head>
<body>
<h1>角色建模调试台 · 每格 260px 高（网格每 26px = 0.1 单位，红线为脚底 y=0）</h1>
<div class="legend">左：正视 idle　中：背视 run　右：背视 jump — 三视图对照检查比例与四肢</div>
<div class="grid" id="grid"></div>

<script src="../js/config.js"></script>
<script src="../js/chars.js"></script>
<script>
(function () {
  const skins = ['naiwa','nailong','yujie','xiaoyang','zhangtongxue','liziqi','liugenhong','donglaoshi','goose','cybernaiwa','inspector','dog'];
  const H = 280, W = 470;
  const grid = document.getElementById('grid');
  skins.forEach(function (skin) {
    const cell = document.createElement('div');
    cell.className = 'cell';
    const cv = document.createElement('canvas');
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.width = W * dpr; cv.height = H * dpr;
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
    const c = cv.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);

    // 三条视图
    const views = [
      { state: 'idle', t: 0.15, front: true, x: W * 0.17 },
      { state: 'run', t: 0.12, front: false, x: W * 0.5 },
      { state: 'jump', t: 0.6, front: false, x: W * 0.83 },
    ];
    const hp = H * 0.86;                 // 1 单位 = hp 像素
    views.forEach(function (v) {
      c.save();
      c.translate(v.x, H * 0.94);
      c.scale(hp, -hp);
      CharArtAPI.draw(c, skin, { state: v.state, t: v.t, front: v.front, lean: 0, squash: 0 });
      c.restore();
    });
    // 脚底基准线 + 单位刻度
    c.strokeStyle = 'rgba(230,66,60,.75)'; c.lineWidth = 1;
    c.beginPath(); c.moveTo(0, H * 0.92); c.lineTo(W, H * 0.92); c.stroke();
    c.strokeStyle = 'rgba(80,140,220,.5)';
    c.beginPath(); c.moveTo(0, H * 0.92 - hp); c.lineTo(W, H * 0.92 - hp); c.stroke();
    c.fillStyle = 'rgba(80,140,220,.85)'; c.font = '10px sans-serif';
    c.fillText('y=1', 2, H * 0.92 - hp - 3);

    cell.appendChild(cv);
    const n = document.createElement('div');
    n.className = 'name';
    n.textContent = skin;
    cell.appendChild(n);
    grid.appendChild(cell);
  });
})();
</script>
</body>
</html>
